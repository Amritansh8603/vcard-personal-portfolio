name: LinkedIn Post Finder

on:
  push:
    paths: ["linkedin-post-finder/**", ".github/workflows/linkedin-post-finder.yml"]
  pull_request:
    paths: ["linkedin-post-finder/**"]
  schedule:
    - cron: "30 3 * * *"   # daily, 09:00 IST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: linkedin-post-finder
  cancel-in-progress: false

jobs:
  test:                       # CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: linkedin-post-finder/requirements.txt
      - run: pip install -r linkedin-post-finder/requirements.txt
      - run: pytest linkedin-post-finder/tests -q

  find:                       # CD: runs on schedule / manual trigger only
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: linkedin-post-finder/requirements.txt
      - run: pip install -r linkedin-post-finder/requirements.txt
      - id: run
        run: python linkedin-post-finder/finder.py
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
      - name: Commit results
        if: steps.run.outputs.new_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkedin-post-finder/results.md linkedin-post-finder/seen.json
          git commit -m "chore: ${{ steps.run.outputs.new_count }} new matching LinkedIn posts"
          git push
      - name: Open issue so you get notified
        if: steps.run.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "LinkedIn matches $(date +%F): ${{ steps.run.outputs.new_count }} new" \
            --body "See [results.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/linkedin-post-finder/results.md)."
