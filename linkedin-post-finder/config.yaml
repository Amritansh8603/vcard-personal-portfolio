# Edit this file to change what the pipeline looks for.
roles:                    # a post must mention at least one
  - software engineer
  - backend developer
  - python developer
experience:
  min_years: 1            # your experience: 1 year; posts asking for a
  max_years: 1            # range that includes 1 year will match (0-2, 1-3, 1+)
  include_fresher: true   # also match "fresher / entry level" posts
hiring_keywords:          # a post must mention at least one
  - hiring
  - opening
  - vacancy
  - "we are looking"
locations: []             # optional, e.g. [bangalore, remote]; empty = any
max_results_per_query: 20 # Google CSE returns 10 per page, max 100 total
